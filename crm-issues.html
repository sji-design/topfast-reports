const ST={cat:'all',theme:'all',q:''};
const TH=[['all','همه تم‌ها'],['has_dark','Dark Mode'],['dark','اختصاصی Dark'],['light','اختصاصی Light']];
const norm=s=>s.toLowerCase().replace(/ي/g,'ی').replace(/ك/g,'ک');
const thOk=(t,f)=>f==='all'||(f==='has_dark'?t!=='light':t===f);
const hay=CATS.map(c=>c.items.map(it=>norm(it.title+' '+it.pages.join(' '))));
const ok=(ci,ii,cat,th,q)=>(cat==='all'||CATS[ci].id===cat)&&thOk(CATS[ci].items[ii].theme,th)&&(!q||hay[ci][ii].includes(q));
const count=(cat,th,q)=>{let n=0;CATS.forEach((c,ci)=>c.items.forEach((_,ii)=>{if(ok(ci,ii,cat,th,q))n++}));return n};
function setC(v){ST.cat=v;apply()}
function setT(v){ST.theme=v;apply()}
function apply(){
  const q=norm(ST.q.trim());
  document.getElementById('tabs').innerHTML=[['all','همه',null]].concat(CATS.map(c=>[c.id,c.shortFa,COL[c.id][0]])).map(t=>`<button class="tab${ST.cat===t[0]?' on':''}" onclick="setC('${t[0]}')">${t[2]?`<i style="background:${t[2]}"></i>`:''}${t[1]}<small>${fa(count(t[0],ST.theme,q))}</small></button>`).join('');
  document.getElementById('pills').innerHTML=TH.map(t=>`<button class="pill${ST.theme===t[0]?' on':''}" onclick="setT('${t[0]}')">${t[1]} (${fa(count(ST.cat,t[0],q))})</button>`).join('');
  let vis=0;
  document.querySelectorAll('.row').forEach(r=>{const s=ok(+r.dataset.c,+r.dataset.i,ST.cat,ST.theme,q);r.hidden=!s;if(s)vis++});
  document.querySelectorAll('section').forEach(s=>{const n=[...s.querySelectorAll('.row')].filter(r=>!r.hidden).length;s.hidden=!n;s.querySelector('.cnt').textContent=fa(n)+' مورد'});
  document.getElementById('none').hidden=vis>0;
}

const bp=p=>p==='IB Dark'?'IB Dashboard':p.replace(' Dark','');
const PAGES=(()=>{const m={};CATS.forEach(c=>c.items.forEach(it=>{new Set(it.pages.map(bp)).forEach(b=>{m[b]=(m[b]||0)+1})}));return Object.entries(m).sort((a,b)=>b[1]-a[1])})();
const qi=document.getElementById('q'),sug=document.getElementById('sug'),sx=document.getElementById('sx');
let sel=-1,SI=[];
const hl=(t,q)=>{const i=q?norm(t).indexOf(q):-1;return i<0?t:t.slice(0,i)+'<mark>'+t.slice(i,i+q.length)+'</mark>'+t.slice(i+q.length)};
function buildSug(){
  const q=norm(qi.value.trim());SI=[];let h='';
  const row=(s,main,meta)=>{SI.push(s);return `<button class="si" role="option" data-k="${SI.length-1}"><span>${main}</span><em>${meta}</em></button>`};
  const pg=PAGES.filter(p=>!q||norm(p[0]).includes(q)).slice(0,q?4:6);
  if(pg.length){h+=`<h5>${q?'صفحه‌ها':'جستجوی سریع بر اساس صفحه'}</h5>`;pg.forEach(p=>{h+=row({t:'p',v:p[0]},hl(p[0],q),fa(p[1])+' مورد')})}
  if(q){const is=[];CATS.forEach((c,ci)=>c.items.forEach((it,ii)=>{if(norm(it.title).includes(q))is.push([ci,ii])}));
    if(is.length){h+='<h5>ایرادها</h5>';is.slice(0,5).forEach(([ci,ii])=>{h+=row({t:'i',ci,ii},hl(CATS[ci].items[ii].title,q),CATS[ci].shortFa)})}}
  if(!SI.length)h='<div class="sug-empty">نتیجه‌ای پیدا نشد</div>';
  sug.innerHTML=h;
}
function paint(){sug.querySelectorAll('.si').forEach((b,i)=>b.classList.toggle('on',i===sel))}
function openSug(){buildSug();sug.hidden=false;qi.setAttribute('aria-expanded','true')}
function closeSug(){sug.hidden=true;sel=-1;qi.setAttribute('aria-expanded','false')}
function pick(k){const s=SI[k];if(!s)return;closeSug();if(s.t==='i'){openM(s.ci,s.ii)}else{qi.value=s.v;ST.q=s.v;sx.hidden=false;apply()}}
qi.addEventListener('input',()=>{ST.q=qi.value;sx.hidden=!qi.value;apply();sel=-1;openSug()});
qi.addEventListener('focus',openSug);
qi.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(sug.hidden)openSug();const n=SI.length;if(!n)return;sel=(sel+(e.key==='ArrowDown'?1:-1)+n)%n;paint()}
  else if(e.key==='Enter'){if(sel>=0){e.preventDefault();pick(sel)}else closeSug()}
  else if(e.key==='Escape')closeSug()});
sug.addEventListener('mousedown',e=>{const b=e.target.closest('.si');if(b){e.preventDefault();pick(+b.dataset.k)}});
sx.addEventListener('click',()=>{qi.value='';ST.q='';sx.hidden=true;apply();qi.focus()});
document.addEventListener('mousedown',e=>{if(!document.getElementById('sw').contains(e.target))closeSug()});
apply();
function openM(ci,ii){
  const c=CATS[ci],it=c.items[ii],seen=new Set(),links=[];
  it.pages.forEach(p=>{const l=PL[p];if(!l)return;
    if(!seen.has(l.fig)){seen.add(l.fig);links.push(`<a href="${l.fig}" target="_blank" rel="noopener">Figma · ${p} ↗</a>`)}
    if(!seen.has(l.live)){seen.add(l.live);links.push(`<a href="${l.live}" target="_blank" rel="noopener">Live · ${p.replace(' Dark','')} ↗</a>`)}});
  document.getElementById('mh').innerHTML=`<div><div class="chips"><i class="tag" style="background:color-mix(in srgb,${COL[c.id][0]} 15%,transparent);color:${COL[c.id][0]}">${c.shortFa}</i><i class="tag ${it.sev}">${SEV[it.sev]}</i></div><h3>${it.title}</h3></div><button class="x" onclick="closeM()" aria-label="بستن">×</button>`;
  document.getElementById('mb').innerHTML=`${it.sev==='med'?'':`<div class="why ${it.sev}"><b>چرا ${SEV[it.sev]}؟</b><p>${RS[c.id+':'+ii]||''}</p></div>`}<div class="diff"><div class="box"><h4>Figma</h4>${it.figma}</div><div class="box"><h4>Live</h4>${it.live}</div></div><div class="links">${links.slice(0,6).join('')}</div>`+
    it.imgs.filter(k=>IM[k]).map(k=>`<figure><figcaption>${IM[k].caption}</figcaption><img src="${IM[k].src}" alt="" onclick="zoom(this)"></figure>`).join('');
  document.getElementById('mdl').classList.add('open');document.body.style.overflow='hidden';
  document.getElementById('mdl').scrollTop=0;
}
function closeM(){document.getElementById('mdl').classList.remove('open');document.body.style.overflow=''}
function zoom(e){document.getElementById('lbi').src=e.src;document.getElementById('lb').classList.add('open')}
document.getElementById('mdl').addEventListener('click',e=>{if(e.target.id==='mdl')closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const l=document.getElementById('lb');l.classList.contains('open')?l.classList.remove('open'):closeM()}});
</script>
